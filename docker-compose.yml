services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: locosis
      POSTGRES_PASSWORD: locosis
      POSTGRES_DB: locosis
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Capture des emails en dev : http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
